<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Connext Rush</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
#game { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }
#touch-ui {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
  display: none; justify-content: space-between; align-items: flex-end;
  padding: 10px 14px 14px; pointer-events: none;
}
@media (hover: none) and (pointer: coarse) {
  #touch-ui { display: flex; }
}
.tc-group { display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: all; }
.tc-row   { display: flex; gap: 8px; }
.tbtn {
  width: 66px; height: 66px;
  background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.28);
  border-radius: 14px; color: rgba(255,255,255,0.8); font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  cursor: pointer; transition: background 0.08s;
}
.tbtn:active, .tbtn.pressed { background: rgba(255,255,255,0.32); border-color: rgba(255,255,255,0.7); }
#tb-space { width: 90px; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="game"></div>
<!-- Touch controls overlay (transparent on desktop, usable on mobile) -->
<div id="touch-ui">
  <div class="tc-group">
    <button class="tbtn" id="tb-left">&#9664;</button>
  </div>
  <div class="tc-group">
    <button class="tbtn" id="tb-up">&#9650;</button>
    <div class="tc-row">
      <button class="tbtn" id="tb-space">ACTION</button>
    </div>
    <button class="tbtn" id="tb-down">&#9660;</button>
  </div>
  <div class="tc-group">
    <button class="tbtn" id="tb-right">&#9654;</button>
  </div>
</div>
<script>
// Global touch input — consumed by each scene's update()
window.tIn = { left:false, right:false, up:false, down:false, space:false, leftTap:false, rightTap:false };
(function() {
  function wire(id, onDown, onUp) {
    const el = document.getElementById(id);
    if (!el) return;
    ['touchstart','mousedown'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.add('pressed'); onDown(); }, { passive: false }));
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.remove('pressed'); onUp(); }, { passive: false }));
  }
  const t = window.tIn;
  wire('tb-left',  () => { t.left  = true;  t.leftTap  = true; }, () => { t.left  = false; });
  wire('tb-right', () => { t.right = true;  t.rightTap = true; }, () => { t.right = false; });
  wire('tb-up',    () => { t.up    = true;  }, () => { t.up    = false; });
  wire('tb-down',  () => { t.down  = true;  }, () => { t.down  = false; });
  wire('tb-space', () => { t.space = true;  }, () => { t.space = false; });
})();
const W = 800, H = 600;

// ─────────────────────────────────────────────────────────────
// MAIN MENU
// ─────────────────────────────────────────────────────────────
class MainMenu extends Phaser.Scene {
  constructor() { super('MainMenu'); }

  create() {
    this.add.rectangle(W/2, H/2, W, H, 0x0a0a1a);

    // Animated road stripes
    this.stripes = [];
    for (let i = 0; i < 8; i++) {
      const s = this.add.rectangle(W/2, i * 80, 6, 50, 0x333355);
      this.stripes.push(s);
    }

    this.add.text(W/2, 70, 'CONNEXT', {
      fontSize: '72px', fontFamily: 'Arial Black',
      fill: '#00d4ff', stroke: '#003388', strokeThickness: 10
    }).setOrigin(0.5);
    this.add.text(W/2, 148, 'R U S H', {
      fontSize: '36px', fontFamily: 'Arial Black',
      fill: '#ff6600', stroke: '#000', strokeThickness: 4, letterSpacing: 18
    }).setOrigin(0.5);
    this.add.text(W/2, 195, 'The Broadband Adventure', {
      fontSize: '18px', fontFamily: 'Arial', fill: '#8888aa', fontStyle: 'italic'
    }).setOrigin(0.5);

    const lvls = [
      { label: '⚡  LEVEL 1 — FIBER FRENZY', sub: 'Dodge traffic & deliver the goods', scene: 'Level1', c: 0x003366 },
      { label: '🔌  LEVEL 2 — LINE RUNNER',  sub: 'Route fiber underground',           scene: 'Level2', c: 0x003322 },
      { label: '📦  LEVEL 3 — INSTALLER RUSH',sub: 'Install gear in the right rooms',  scene: 'Level3', c: 0x332200 },
      { label: '🦣  LEVEL 4 — YETI RUN',     sub: 'Survive the mountain... if you can',scene: 'Level4', c: 0x1a001a },
    ];

    lvls.forEach((l, i) => {
      const y = 268 + i * 64;
      const bg = this.add.rectangle(W/2, y, 580, 52, l.c)
        .setInteractive({ useHandCursor: true })
        .setStrokeStyle(1, 0x334466);
      this.add.text(W/2, y - 8, l.label, {
        fontSize: '18px', fontFamily: 'Arial Black', fill: '#e0e8ff'
      }).setOrigin(0.5);
      this.add.text(W/2, y + 12, l.sub, {
        fontSize: '12px', fontFamily: 'Arial', fill: '#667799'
      }).setOrigin(0.5);
      bg.on('pointerover', () => bg.setFillStyle(Phaser.Display.Color.ValueToColor(l.c).brighten(30).color));
      bg.on('pointerout',  () => bg.setFillStyle(l.c));
      bg.on('pointerdown', () => { this.registry.set('playAll', false); this.scene.start(l.scene); });
    });

    const playAll = this.add.rectangle(W/2, 548, 340, 54, 0xdd5500)
      .setInteractive({ useHandCursor: true });
    this.add.text(W/2, 548, '▶  PLAY ALL 4 LEVELS', {
      fontSize: '22px', fontFamily: 'Arial Black', fill: '#fff'
    }).setOrigin(0.5);
    playAll.on('pointerover', () => playAll.setFillStyle(0xff7700));
    playAll.on('pointerout',  () => playAll.setFillStyle(0xdd5500));
    playAll.on('pointerdown', () => {
      this.registry.set('playAll', true);
      ['totalScore','l1','l2','l3','l4'].forEach(k => this.registry.set(k, 0));
      this.scene.start('Level1');
    });

    this.add.text(W/2, 592, '← → or A D to steer  |  SPACE to interact', {
      fontSize: '12px', fontFamily: 'Arial', fill: '#445566'
    }).setOrigin(0.5);
  }

  update() {
    this.stripes.forEach(s => { s.y += 2; if (s.y > H + 40) s.y = -40; });
  }
}

// ─────────────────────────────────────────────────────────────
// LEVEL 1 — FIBER FRENZY  (highway dodge)
// ─────────────────────────────────────────────────────────────
class Level1 extends Phaser.Scene {
  constructor() { super('Level1'); }

  create() {
    this.score = 0;  this.hp = 4;  this.timeLeft = 40;
    this.done = false; this.speed = 5; this.dist = 0;
    this.lanes = [W/2 - 150, W/2 - 50, W/2 + 50, W/2 + 150];
    this.lane = 1; this.targetX = this.lanes[1];
    this.shieldOn = false; this.shieldMs = 0;
    this.combo = 1; this.lastMove = 0;

    // Road
    this.add.rectangle(W/2, H/2, W, H, 0x2a2a2a);
    this.add.rectangle(W/2 - 200, H/2, 2, H, 0xffffff);
    this.add.rectangle(W/2 + 200, H/2, 2, H, 0xffffff);
    this.add.rectangle(50,  H/2, 100, H, 0x3a5a3a); // grass L
    this.add.rectangle(W-50,H/2, 100, H, 0x3a5a3a); // grass R

    this.stripes = [];
    for (let i = 0; i < 10; i++) {
      this.stripes.push(this.add.rectangle(W/2 - 100, i * 70 - 35, 6, 44, 0xffee00));
      this.stripes.push(this.add.rectangle(W/2,       i * 70 - 35, 6, 44, 0xffee00));
      this.stripes.push(this.add.rectangle(W/2 + 100, i * 70 - 35, 6, 44, 0xffee00));
    }

    // Truck (player)
    this.truck = this.add.container(this.targetX, H - 100);
    const tb = this.add.rectangle(0, 5, 46, 78, 0xfafafa);
    const tc = this.add.rectangle(0, -20, 42, 36, 0xddddee);
    const tl = this.add.text(0, 12, 'CONNEXT', { fontSize: '7px', fill: '#003399', fontFamily: 'Arial Black' }).setOrigin(0.5);
    const wfl = this.add.circle(-18, -28, 7, 0x111111);
    const wfr = this.add.circle(18,  -28, 7, 0x111111);
    const wrl = this.add.circle(-18,  28, 7, 0x111111);
    const wrr = this.add.circle(18,   28, 7, 0x111111);
    const ladder = this.add.rectangle(0, -10, 50, 6, 0xcccccc);
    this.truck.add([tb, tc, tl, wfl, wfr, wrl, wrr, ladder]);

    // Shield ring
    this.shield = this.add.circle(this.targetX, H - 100, 44, 0x00d4ff, 0).setStrokeStyle(3, 0x00d4ff);

    // Obstacle & powerup groups
    this.obs = this.add.group();
    this.pups = this.add.group();

    // HUD
    this.sTxt = this.add.text(10,10,'SCORE: 0',{fontSize:'20px',fontFamily:'Arial Black',fill:'#fff'});
    this.hTxt = this.add.text(10,36,'❤️❤️❤️❤️',{fontSize:'20px'});
    this.tTxt = this.add.text(W-10,10,'40',{fontSize:'20px',fontFamily:'Arial Black',fill:'#ffff00'}).setOrigin(1,0);
    this.cTxt = this.add.text(W/2,10,'',{fontSize:'22px',fontFamily:'Arial Black',fill:'#ff8800'}).setOrigin(0.5,0);
    this.add.text(W-10,36,'TIME',{fontSize:'12px',fill:'#888',fontFamily:'Arial'}).setOrigin(1,0);

    this.showBanner('LEVEL 1: FIBER FRENZY', 'Reach the destination — dodge traffic!');

    this.spawnEv = this.time.addEvent({ delay: 1400, callback: this.spawnObs, callbackScope: this, loop: true });
    this.pupEv   = this.time.addEvent({ delay: 7000,  callback: this.spawnPup,  callbackScope: this, loop: true });
    this.tickEv  = this.time.addEvent({
      delay: 1000, loop: true, callback: () => {
        if (this.done) return;
        this.timeLeft--;
        this.tTxt.setText(this.timeLeft);
        if (this.timeLeft <= 0) this.winLevel();
      }
    });

    this.keys = this.input.keyboard.addKeys({
      left: Phaser.Input.Keyboard.KeyCodes.LEFT,
      right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      a: Phaser.Input.Keyboard.KeyCodes.A,
      d: Phaser.Input.Keyboard.KeyCodes.D,
    });
  }

  spawnObs() {
    if (this.done) return;
    const laneIdx = Phaser.Math.Between(0, 3);
    const x = this.lanes[laneIdx];
    const kind = Phaser.Utils.Array.GetRandom(['car','car','truck','barrier']);
    let color, w, h;
    if (kind === 'car')     { color = [0xff3333,0x3399ff,0xffcc00,0x33cc33][Phaser.Math.Between(0,3)]; w=40; h=72; }
    else if (kind === 'truck') { color = 0x886644; w=50; h=104; }
    else                    { color = 0xff8800; w=80; h=28; }
    const r = this.add.rectangle(x, -80, w, h, color);
    r.laneIdx = laneIdx; r.nearDone = false;
    this.obs.add(r);
  }

  spawnPup() {
    if (this.done) return;
    const laneIdx = Phaser.Math.Between(0, 3);
    const kind = Phaser.Utils.Array.GetRandom(['turbo','shield','scanner']);
    const cols = { turbo: 0xff6600, shield: 0x00ccff, scanner: 0x00ff88 };
    const icons = { turbo: '⚡', shield: '🛡️', scanner: '📡' };
    const c = this.add.container(this.lanes[laneIdx], -60);
    c.add(this.add.circle(0,0,20, cols[kind]));
    c.add(this.add.text(0,0,icons[kind],{fontSize:'18px'}).setOrigin(0.5));
    c.kind = kind;
    this.pups.add(c);
  }

  update(t, dt) {
    if (this.done) return;

    this.dist += this.speed;
    this.speed = Math.min(5 + this.dist / 3000, 11);

    // Lane input
    if (t - this.lastMove > 190) {
      const ti = window.tIn;
      const goL = Phaser.Input.Keyboard.JustDown(this.keys.left) || Phaser.Input.Keyboard.JustDown(this.keys.a) || ti.leftTap;
      const goR = Phaser.Input.Keyboard.JustDown(this.keys.right) || Phaser.Input.Keyboard.JustDown(this.keys.d) || ti.rightTap;
      if (goL) ti.leftTap = false;
      if (goR) ti.rightTap = false;
      if (goL && this.lane > 0) { this.lane--; this.targetX = this.lanes[this.lane]; this.lastMove = t; }
      if (goR && this.lane < 3) { this.lane++; this.targetX = this.lanes[this.lane]; this.lastMove = t; }
    }
    this.truck.x += (this.targetX - this.truck.x) * 0.22;
    this.shield.x = this.truck.x; this.shield.y = this.truck.y;

    // Road stripes
    this.stripes.forEach(s => { s.y += this.speed; if (s.y > H + 30) s.y = -30; });

    // Obstacles
    this.obs.getChildren().forEach(o => {
      o.y += this.speed;
      const dx = Math.abs(o.x - this.truck.x);
      const dy = Math.abs(o.y - this.truck.y);
      if (!o.nearDone && dy < 65 && dx < 80) {
        o.nearDone = true;
        if (dx > 50) { this.score += 50 * this.combo; this.float(this.truck.x, this.truck.y-50, 'NEAR MISS +50', '#ff8800'); }
      }
      if (!this.shieldOn && dy < 38 && dx < 28) {
        if (!o.hit) { o.hit = true; this.hitTruck(); o.destroy(); }
      }
      if (o.y > H + 80) { this.score += 10; o.destroy(); }
    });

    // Powerups
    this.pups.getChildren().forEach(p => {
      p.y += this.speed * 0.75;
      if (Math.abs(p.y - this.truck.y) < 32 && Math.abs(p.x - this.truck.x) < 32) {
        this.applyPup(p.kind); p.destroy();
      }
      if (p.y > H + 80) p.destroy();
    });

    // Shield
    if (this.shieldOn) {
      this.shieldMs -= dt;
      this.shield.setAlpha(0.25 + 0.2 * Math.sin(t / 80));
      if (this.shieldMs <= 0) { this.shieldOn = false; this.shield.setAlpha(0); }
    }

    this.score += 0.06 * this.speed;
    this.sTxt.setText('SCORE: ' + Math.floor(this.score));
  }

  applyPup(k) {
    if (k === 'turbo') {
      this.speed += 4; this.time.delayedCall(3000, () => this.speed -= 4);
      this.float(this.truck.x, this.truck.y - 60, 'TURBO! ⚡', '#ff6600');
    } else if (k === 'shield') {
      this.shieldOn = true; this.shieldMs = 5000;
      this.float(this.truck.x, this.truck.y - 60, 'SHIELD! 🛡️', '#00d4ff');
    } else {
      this.combo = 3; this.cTxt.setText('3× COMBO');
      this.time.delayedCall(5000, () => { this.combo = 1; this.cTxt.setText(''); });
      this.float(this.truck.x, this.truck.y - 60, '3× SCANNER!', '#00ff88');
    }
  }

  hitTruck() {
    this.hp--;
    this.cameras.main.shake(220, 0.02);
    this.cameras.main.flash(80, 255, 0, 0);
    const hearts = ['','❤️','❤️❤️','❤️❤️❤️','❤️❤️❤️❤️'];
    this.hTxt.setText(this.hp > 0 ? hearts[this.hp] : '💔');
    if (this.hp <= 0) this.loseLevel();
  }

  winLevel() {
    if (this.done) return; this.done = true;
    this.spawnEv.destroy(); this.tickEv.destroy();
    this.endScreen('DELIVERY COMPLETE! 🚚', true, 'Level2');
  }

  loseLevel() {
    if (this.done) return; this.done = true;
    this.spawnEv.destroy(); this.tickEv.destroy();
    this.endScreen('TRUCK WRECKED! 💥', false, 'Level1');
  }

  float(x, y, msg, col) {
    const t = this.add.text(x, y, msg, { fontSize: '19px', fill: col, fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
    this.tweens.add({ targets: t, y: y - 55, alpha: 0, duration: 1100, onComplete: () => t.destroy() });
  }

  showBanner(title, sub) {
    const bg = this.add.rectangle(W/2, H/2, W, 86, 0x000000, 0.82);
    const t1 = this.add.text(W/2, H/2 - 14, title, { fontSize: '28px', fontFamily: 'Arial Black', fill: '#00d4ff' }).setOrigin(0.5);
    const t2 = this.add.text(W/2, H/2 + 18, sub,   { fontSize: '16px', fontFamily: 'Arial', fill: '#fff' }).setOrigin(0.5);
    this.time.delayedCall(1500, () => { bg.destroy(); t1.destroy(); t2.destroy(); });
  }

  endScreen(msg, won, next) {
    const sc = Math.floor(this.score);
    const prev = this.registry.get('totalScore') || 0;
    this.registry.set('totalScore', prev + sc);
    this.registry.set('l1', sc);
    this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.78);
    this.add.text(W/2, H/2 - 80, won ? '🚚  DELIVERY COMPLETE!' : '💥  TRUCK WRECKED!', { fontSize: '30px', fontFamily: 'Arial Black', fill: won ? '#00ff88' : '#ff4444', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);
    this.add.text(W/2, H/2 - 30, 'Score: ' + sc.toLocaleString(), { fontSize: '24px', fontFamily: 'Arial', fill: '#fff' }).setOrigin(0.5);
    if (won) this.time.delayedCall(3500, () => this.scene.start(next));
    this.btn(W/2, H/2 + 40, won ? 'NEXT LEVEL ▶' : 'TRY AGAIN', 0xdd5500, () => this.scene.start(next));
    this.btn(W/2, H/2 + 96, 'MAIN MENU', 0x333344, () => this.scene.start('MainMenu'));
  }

  btn(x, y, label, col, cb) {
    const b = this.add.rectangle(x, y, 260, 48, col).setInteractive({ useHandCursor: true });
    this.add.text(x, y, label, { fontSize: '20px', fontFamily: 'Arial Black', fill: '#fff' }).setOrigin(0.5);
    b.on('pointerover', () => b.setAlpha(0.8));
    b.on('pointerout',  () => b.setAlpha(1));
    b.on('pointerdown', cb);
  }
}

// ─────────────────────────────────────────────────────────────
// LEVEL 2 — LINE RUNNER  (underground wire routing)
// ─────────────────────────────────────────────────────────────
class Level2 extends Phaser.Scene {
  constructor() { super('Level2'); }

  create() {
    this.score = 0; this.timeLeft = 80; this.done = false;
    this.bends = 0; this.maxBends = 22; this.streak = 0;
    this.drillX = 110; this.drillY = H / 2;
    this.wirePoints = [{ x: 110, y: H / 2 }];
    this.lastAngle = null; this.moving = false;
    this.hazards = [];

    // Dirt background
    const g = this.add.graphics();
    g.fillStyle(0x3d2b1f); g.fillRect(0, 0, W, H);
    for (let i = 0; i < 200; i++) {
      g.fillStyle(Math.random() > 0.5 ? 0x2d1b0f : 0x4d3b2f, 0.4);
      g.fillRect(Phaser.Math.Between(0,W), Phaser.Math.Between(0,H), Phaser.Math.Between(4,18), Phaser.Math.Between(4,18));
    }

    // Van (start)
    const van = this.add.container(70, H/2);
    const vb = this.add.rectangle(0, 0, 68, 40, 0xfafafa);
    const vl = this.add.text(0, 0, 'CONNEXT', { fontSize: '7px', fill: '#003399', fontFamily: 'Arial Black' }).setOrigin(0.5);
    van.add([vb, vl]);

    // Destination
    this.add.rectangle(W - 50, H/2, 52, 52, 0x003366);
    this.add.text(W - 50, H/2, '📦', { fontSize: '26px' }).setOrigin(0.5);
    this.add.text(W - 50, H/2 - 38, 'DEST', { fontSize: '11px', fill: '#00d4ff', fontFamily: 'Arial Black' }).setOrigin(0.5);

    // Destination glow (pulsing)
    const destGlow = this.add.circle(W - 50, H/2, 34, 0x00d4ff, 0).setStrokeStyle(2, 0x00d4ff);
    this.tweens.add({ targets: destGlow, scaleX: 1.4, scaleY: 1.4, alpha: 0.8, duration: 800, yoyo: true, repeat: -1 });

    // Wire graphics
    this.wireGfx = this.add.graphics();

    // Drill head
    this.drillHead = this.add.container(this.drillX, this.drillY);
    const dh = this.add.circle(0, 0, 11, 0xffaa00);
    const dt = this.add.text(0, 0, '⚙', { fontSize: '13px' }).setOrigin(0.5);
    this.drillHead.add([dh, dt]);

    // Hazards
    this.buildHazards();

    // HUD
    this.sTxt = this.add.text(10, 10, 'SCORE: 0', { fontSize: '20px', fontFamily: 'Arial Black', fill: '#fff' });
    this.tTxt = this.add.text(W - 10, 10, '80', { fontSize: '20px', fontFamily: 'Arial Black', fill: '#ffff00' }).setOrigin(1, 0);
    this.bTxt = this.add.text(10, 36, 'BENDS: 0 / 22', { fontSize: '16px', fontFamily: 'Arial', fill: '#ff8800' });
    this.add.text(W - 10, 36, 'TIME', { fontSize: '12px', fill: '#888', fontFamily: 'Arial' }).setOrigin(1, 0);
    this.add.text(10, 56, 'WASD / ARROWS  |  reach the 📦', { fontSize: '11px', fill: '#556677', fontFamily: 'Arial' });

    this.showBanner('LEVEL 2: LINE RUNNER', 'Route fiber to the box — avoid buried utilities!');

    this.tickEv = this.time.addEvent({
      delay: 1000, loop: true, callback: () => {
        if (this.done) return;
        this.timeLeft--;
        this.tTxt.setText(this.timeLeft);
        if (this.timeLeft <= 0) this.loseLevel('Time expired!');
      }
    });

    this.keys = this.input.keyboard.addKeys({
      left:  Phaser.Input.Keyboard.KeyCodes.LEFT,
      right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      up:    Phaser.Input.Keyboard.KeyCodes.UP,
      down:  Phaser.Input.Keyboard.KeyCodes.DOWN,
      a: Phaser.Input.Keyboard.KeyCodes.A, d: Phaser.Input.Keyboard.KeyCodes.D,
      w: Phaser.Input.Keyboard.KeyCodes.W, s: Phaser.Input.Keyboard.KeyCodes.S,
    });
  }

  buildHazards() {
    const types = [
      { label: '💧', col: 0x0088ff, r: 28, name: 'Sprinkler' },
      { label: '🔥', col: 0xff6600, r: 32, name: 'Gas Pipe' },
      { label: '⚡', col: 0xffee00, r: 24, name: 'Power Line' },
      { label: '🚰', col: 0x0044ff, r: 36, name: 'Water Main' },
      { label: '🌳', col: 0x226622, r: 22, name: 'Tree Roots' },
    ];

    for (let i = 0; i < 14; i++) {
      const tp = Phaser.Utils.Array.GetRandom(types);
      let x, y, ok = false, tries = 0;
      do {
        x = Phaser.Math.Between(160, W - 100);
        y = Phaser.Math.Between(55, H - 55);
        ok = this.hazards.every(h => Phaser.Math.Distance.Between(h.x, h.y, x, y) > 88);
        tries++;
      } while (!ok && tries < 30);

      const ring = this.add.circle(x, y, tp.r, tp.col, 0.25).setStrokeStyle(2, tp.col);
      this.add.text(x, y, tp.label, { fontSize: '20px' }).setOrigin(0.5);
      this.tweens.add({ targets: ring, scaleX: 1.35, scaleY: 1.35, alpha: 0.7, duration: 900 + i * 70, yoyo: true, repeat: -1 });

      this.hazards.push({ x, y, r: tp.r, name: tp.name, ring, hit: false, nearDone: false });
    }
  }

  update(t, dt) {
    if (this.done) return;

    let dx = 0, dy = 0;
    const sp = 3.2;
    const ti2 = window.tIn;
    if (this.keys.left.isDown  || this.keys.a.isDown || ti2.left)  dx = -sp;
    if (this.keys.right.isDown || this.keys.d.isDown || ti2.right) dx =  sp;
    if (this.keys.up.isDown    || this.keys.w.isDown || ti2.up)    dy = -sp;
    if (this.keys.down.isDown  || this.keys.s.isDown || ti2.down)  dy =  sp;

    if (dx !== 0 || dy !== 0) {
      const angle = Math.atan2(dy, dx);

      if (this.lastAngle !== null) {
        const diff = Math.abs(angle - this.lastAngle);
        if (diff > 0.52 && diff < Math.PI * 2 - 0.52) {
          this.bends++;
          this.bTxt.setText('BENDS: ' + this.bends + ' / 22');
          if (this.bends >= this.maxBends) { this.loseLevel('Wire snapped — too many bends!'); return; }
        }
      }
      this.lastAngle = angle;

      this.drillX = Phaser.Math.Clamp(this.drillX + dx, 112, W - 72);
      this.drillY = Phaser.Math.Clamp(this.drillY + dy, 14, H - 14);
      this.drillHead.setPosition(this.drillX, this.drillY);

      const last = this.wirePoints[this.wirePoints.length - 1];
      if (Phaser.Math.Distance.Between(last.x, last.y, this.drillX, this.drillY) > 5)
        this.wirePoints.push({ x: this.drillX, y: this.drillY });

      // Redraw wire
      this.wireGfx.clear();
      this.wireGfx.lineStyle(4, 0xffaa00, 1);
      this.wireGfx.beginPath();
      this.wireGfx.moveTo(this.wirePoints[0].x, this.wirePoints[0].y);
      this.wirePoints.forEach(p => this.wireGfx.lineTo(p.x, p.y));
      this.wireGfx.strokePath();

      // Dirt particles
      if (Math.random() > 0.65) {
        const px = this.drillX + Phaser.Math.Between(-6, 6);
        const py = this.drillY + Phaser.Math.Between(-6, 6);
        const dp = this.add.circle(px, py, Phaser.Math.Between(2, 5), 0x7a5530);
        this.tweens.add({ targets: dp, alpha: 0, scaleX: 0, scaleY: 0, duration: 380, onComplete: () => dp.destroy() });
      }

      // Hazard detection
      this.hazards.forEach(h => {
        if (h.hit) return;
        const d = Phaser.Math.Distance.Between(this.drillX, this.drillY, h.x, h.y);
        if (d < h.r) {
          h.hit = true;
          h.ring.setFillStyle(0xff0000, 0.6);
          this.cameras.main.shake(350, 0.025);
          this.cameras.main.flash(120, 255, 60, 0);
          this.loseLevel('HIT: ' + h.name + '!');
        } else if (d < h.r + 34 && !h.nearDone) {
          h.nearDone = true;
          this.streak++;
          const bonus = 80 * this.streak;
          this.score += bonus;
          this.float(this.drillX, this.drillY - 30, 'CLOSE! +' + bonus, '#ff8800');
          this.time.delayedCall(1200, () => { h.nearDone = false; });
        }
      });

      // Destination check
      if (Phaser.Math.Distance.Between(this.drillX, this.drillY, W - 50, H / 2) < 36) {
        this.winLevel();
      }

      this.score += 0.08;
      this.sTxt.setText('SCORE: ' + Math.floor(this.score));
    }
  }

  float(x, y, msg, col) {
    const t = this.add.text(x, y, msg, { fontSize: '17px', fill: col, fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
    this.tweens.add({ targets: t, y: y - 52, alpha: 0, duration: 1100, onComplete: () => t.destroy() });
  }

  showBanner(title, sub) {
    const bg = this.add.rectangle(W/2, H/2, W, 86, 0x000000, 0.82);
    const t1 = this.add.text(W/2, H/2 - 14, title, { fontSize: '26px', fontFamily: 'Arial Black', fill: '#00d4ff' }).setOrigin(0.5);
    const t2 = this.add.text(W/2, H/2 + 18, sub,   { fontSize: '15px', fontFamily: 'Arial', fill: '#fff' }).setOrigin(0.5);
    this.time.delayedCall(2600, () => { bg.destroy(); t1.destroy(); t2.destroy(); });
  }

  winLevel() {
    if (this.done) return; this.done = true;
    this.tickEv.destroy();
    const bonus = this.timeLeft * 18 + Math.max(0, (this.maxBends - this.bends) * 40);
    this.score += bonus;
    this.float(W/2, H/2 - 60, 'TIME BONUS +' + (this.timeLeft * 18), '#ffd700');
    this.time.delayedCall(700, () => this.endScreen('CONNECTION ESTABLISHED! 🔌', true, 'Level3'));
  }

  loseLevel(reason) {
    if (this.done) return; this.done = true;
    this.tickEv.destroy();
    this.endScreen('WIRE DAMAGED! 💥\n' + reason, false, 'Level2');
  }

  endScreen(msg, won, next) {
    const sc = Math.floor(this.score);
    this.registry.set('totalScore', (this.registry.get('totalScore') || 0) + sc);
    this.registry.set('l2', sc);
    this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.8);
    this.add.text(W/2, H/2 - 110, won ? '🔌' : '💥', { fontSize: '60px' }).setOrigin(0.5);
    this.add.text(W/2, H/2 - 40, msg, { fontSize: '28px', fontFamily: 'Arial Black', fill: won ? '#00ff88' : '#ff4444', stroke: '#000', strokeThickness: 4, align: 'center' }).setOrigin(0.5);
    this.add.text(W/2, H/2 + 30, 'Score: ' + sc.toLocaleString(), { fontSize: '22px', fontFamily: 'Arial', fill: '#fff' }).setOrigin(0.5);
    this.btn(W/2, H/2 + 90, won ? 'NEXT LEVEL ▶' : 'TRY AGAIN', 0xdd5500, () => this.scene.start(next));
    this.btn(W/2, H/2 + 148, 'MAIN MENU', 0x333344, () => this.scene.start('MainMenu'));
  }

  btn(x, y, label, col, cb) {
    const b = this.add.rectangle(x, y, 280, 46, col).setInteractive({ useHandCursor: true });
    this.add.text(x, y, label, { fontSize: '20px', fontFamily: 'Arial Black', fill: '#fff' }).setOrigin(0.5);
    b.on('pointerover', () => b.setAlpha(0.8)); b.on('pointerout', () => b.setAlpha(1)); b.on('pointerdown', cb);
  }
}

  spawnPets() {
    const petDefs = [
      { x: 200, y: 240, col: 0xff8800, size: 12, sp: 1.8, label: '🐱' },
      { x: 530, y: 210, col: 0x8b4513, size: 14, sp: 2.0, label: '🐶' },

      c.add(this.add.circle(0, 0, d.size, d.col));
      c.add(this.add.text(0, 0, d.label, { fontSize: '16px' }).setOrigin(0.5));
      c.spd = d.sp; c.ang = Math.random() * Math.PI * 2;
      this.pets.push(c);
    });
  }

  updateTask() {
    if (this.taskIdx < this.tasks.length) {
      const t = this.tasks[this.taskIdx];
      this.taskT.setText('CONNECT: ' + t.emoji + ' ' + t.item + '  →  ' + this.roomDefs[t.room].name.toUpperCase());
    }
  }

  update(t, dt) {
    if (this.done) return;

    const sp = 3.2;
    let dx = 0, dy = 0;
    const ti3 = window.tIn;
    if (this.keys.left.isDown  || this.keys.a.isDown || ti3.left)  dx = -sp;
    if (this.keys.right.isDown || this.keys.d.isDown || ti3.right) dx =  sp;
    if (this.keys.up.isDown    || this.keys.w.isDown || ti3.up)    dy = -sp;
    if (this.keys.down.isDown  || this.keys.s.isDown || ti3.down)  dy =  sp;

    this.player.x = Phaser.Math.Clamp(this.player.x + dx, 90, W - 90);
    this.player.y = Phaser.Math.Clamp(this.player.y + dy, 75, H - 25);

    if ((this.keys.space.isDown || ti3.space) && !this.spaceDown) {
      this.spaceDown = true;
      this.tryInstall();
    }
    if (!this.keys.space.isDown && !ti3.space) this.spaceDown = false;

    this.pets.forEach(p => {
      p.ang += 0.018;
      p.x = Phaser.Math.Clamp(p.x + Math.cos(p.ang) * p.spd, 90, W - 90);
      p.y = Phaser.Math.Clamp(p.y + Math.sin(p.ang) * p.spd, 75, H - 25);
      if (Phaser.Math.Distance.Between(p.x, p.y, this.player.x, this.player.y) < 28) {
        this.player.x -= (p.x - this.player.x) * 0.4;
        this.player.y -= (p.y - this.player.y) * 0.4;
        this.score = Math.max(0, this.score - 3);
      }
    });

    if (this.taskIdx < this.tasks.length) {
      const r = this.roomDefs[this.tasks[this.taskIdx].room];
      const a = 0.5 + 0.5 * Math.sin(t / 180);
      this.hlGfx.clear();
      this.hlGfx.lineStyle(6, 0x00ff88, a);
      this.hlGfx.strokeRect(r.x - r.w/2, r.y - r.h/2, r.w, r.h);
    } else {
      this.hlGfx.clear();
    }

    this.score += 0.04;
    this.sTxt.setText('SCORE: ' + Math.floor(this.score));
  }

  tryInstall() {
    if (this.taskIdx >= this.tasks.length) return;
    const task = this.tasks[this.taskIdx];
    const r = this.roomDefs[task.room];
    const inRoom = Math.abs(this.player.x - r.x) < r.w/2 - 10 && Math.abs(this.player.y - r.y) < r.h/2 - 10;

    if (inRoom) {
      this.streak++;
      const bonus = 200 + this.streak * 60 + this.timeLeft * 4;
      this.score += bonus;
      this.installed++;
      this.pTxt.setText('CONNECTIONS: ' + this.installed + ' / 3');
      this.float(this.player.x, this.player.y - 44, task.emoji + ' CONNECTED! +' + bonus, '#00ff88');
      const flash = this.add.rectangle(r.x, r.y, r.w, r.h, 0x00ff88, 0.4);
      this.tweens.add({ targets: flash, alpha: 0, duration: 600, onComplete: () => flash.destroy() });
      this.taskIdx++;
      if (this.taskIdx >= this.tasks.length) {
        this.time.delayedCall(700, () => this.winLevel());
      } else {
        this.updateTask();
      }
    } else {
      this.streak = 0;
      this.score = Math.max(0, this.score - 120);
      this.cameras.main.shake(200, 0.012);
      this.float(this.player.x, this.player.y - 44, 'WRONG ROOM! −120', '#ff4444');
    }
  }

  float(x, y, msg, col) {
    const t = this.add.text(x, y, msg, { fontSize: '17px', fill: col, fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
    this.tweens.add({ targets: t, y: y - 52, alpha: 0, duration: 1100, onComplete: () => t.destroy() });
  }

  showBanner(title, sub) {
    const bg = this.add.rectangle(W/2, H/2, W, 86, 0x000000, 0.82);
    const t1 = this.add.text(W/2, H/2 - 14, title, { fontSize: '26px', fontFamily: 'Arial Black', fill: '#00d4ff' }).setOrigin(0.5);
    const t2 = this.add.text(W/2, H/2 + 18, sub,   { fontSize: '15px', fontFamily: 'Arial', fill: '#fff' }).setOrigin(0.5);
    this.time.delayedCall(2800, () => { bg.destroy(); t1.destroy(); t2.destroy(); });
  }

  winLevel() {
    if (this.done) return; this.done = true;
    this.tickEv.destroy();
    this.score += this.timeLeft * 25;
    this.endScreen('ALL DEVICES CONNECTED! ✅', true, 'Level4');
  }

  loseLevel() {
    if (this.done) return; this.done = true;
    this.tickEv.destroy();
    this.endScreen('INSTALLATION FAILED! ❌', false, 'Level3');
  }

  endScreen(msg, won, next) {
    const sc = Math.floor(this.score);
    this.registry.set('totalScore', (this.registry.get('totalScore') || 0) + sc);
    this.registry.set('l3', sc);
    this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.8);
    this.add.text(W/2, H/2 - 110, won ? '✅' : '❌', { fontSize: '60px' }).setOrigin(0.5);

  makeTree(x, y, group) {
    const c = this.add.container(x, y);
    c.add(this.add.rectangle(0, 16, 11, 28, 0x8b4513));
    c.add(this.add.triangle(0, -10, -18,18, 18,18, 0,-30, 0x1a6622));
    c.add(this.add.triangle(0,  2, -13,14, 13,14, 0,-18, 0x22882a));
    c.scrollFactor = 1;
    group.add(c);
    return c;
  }

  spawnObs() {
    if (this.done) return;
    const laneIdx = Phaser.Math.Between(0, 4);
    const x = this.lanes[laneIdx];
    const kind = Phaser.Utils.Array.GetRandom(['tree','tree','rock','ice','ice']);
    const c = this.add.container(x, -70);

    if (kind === 'tree') {
      c.add(this.add.rectangle(0, 14, 12, 26, 0x8b4513));
      c.add(this.add.triangle(0,-8,-18,16,18,16, 0,-26, 0x1a6622));
    } else if (kind === 'rock') {
      c.add(this.add.ellipse(0, 0, 36, 28, 0x777777));
      c.add(this.add.ellipse(-6, -4, 20, 15, 0x999999));
    } else {
      c.add(this.add.rectangle(0, 0, 44, 18, 0xaaddff, 0.85));
      c.isIce = true;
    }
    c.laneIdx = laneIdx;
    this.obs.add(c);
  }

  summonYeti() {
    const warn = this.add.text(W/2, H/2, '⚠️  YETI APPROACHING!  ⚠️', {
      fontSize: '34px', fontFamily: 'Arial Black', fill: '#ff0000', stroke: '#fff', strokeThickness: 4
    }).setOrigin(0.5).setDepth(30);
    this.cameras.main.shake(600, 0.03);
    this.tTxt.setText('🦣  RUN!!!');
    this.time.delayedCall(2200, () => {
      warn.destroy();
      this.yetiChasing = true;
      this.yetiC.y = H + 60;
    });
  }

  update(t, dt) {
    if (this.done) return;

    // Input
    if (t - this.lastMove > 175) {
      const ti4 = window.tIn;
      const mvL = Phaser.Input.Keyboard.JustDown(this.keys.left)  || Phaser.Input.Keyboard.JustDown(this.keys.a)  || ti4.leftTap;
      const mvR = Phaser.Input.Keyboard.JustDown(this.keys.right) || Phaser.Input.Keyboard.JustDown(this.keys.d)  || ti4.rightTap;
      if (mvL) ti4.leftTap = false;
      if (mvR) ti4.rightTap = false;
      if (mvL && this.lane > 0) { this.lane--; this.targetX = this.lanes[this.lane]; this.lastMove = t; }
      if (mvR && this.lane < 4) { this.lane++; this.targetX = this.lanes[this.lane]; this.lastMove = t; }
    }
    this.sled.x += (this.targetX - this.sled.x) * 0.22;

    // Scroll decorative trees
    [this.treesL, this.treesR].forEach(grp => {
      grp.getChildren().forEach(tr => {
        tr.y += this.speed * 0.55;
        if (tr.y > H + 60) tr.y = -60;
      });
    });

    // Snow
    this.snow.forEach(s => {
      s.y += s.vy + this.speed * 0.25; s.x += s.vx;
      if (s.y > H) s.y = 0; if (s.x < 0) s.x = W; if (s.x > W) s.x = 0;
    });

    // Speed lines (more visible at high speed)
    const lineAlpha = Math.min(0.7, (this.speed - 5) / 12);
    this.speedLines.forEach(sl => {
      sl.y += this.speed * 1.8; if (sl.y > H) sl.y = -70;
      sl.setAlpha(lineAlpha);
    });

    // Obstacles
    this.obs.getChildren().forEach(o => {
      o.y += this.speed;
      if (!o.hit && !o.isIce && Math.abs(o.y - this.sled.y) < 30 && Math.abs(o.x - this.sled.x) < 28) {
        o.hit = true;
        this.cameras.main.shake(300, 0.03);
        this.cameras.main.flash(100, 255, 255, 255);
        this.yetiCatch(); // crash = yeti gets you
      }
      if (o.isIce && !o.hit && Math.abs(o.y - this.sled.y) < 20 && Math.abs(o.x - this.sled.x) < 26) {
        o.hit = true;
        this.float(this.sled.x, this.sled.y - 40, 'ICE PATCH!', '#aaddff');
      }
      if (o.y > H + 80) { this.score += 15; o.destroy(); }
    });

    // Yeti chasing
    if (this.yetiChasing) {
      this.yetiC.y += (this.sled.y + 170 - this.yetiC.y) * 0.025;
      this.yetiC.x += (this.sled.x - this.yetiC.x) * 0.018;

      // Body wobble
      this.yetiC.angle = Math.sin(this.alive * 4) * 6;

      if (!this.done && this.yetiC.y < this.sled.y + 90) this.yetiCatch();

      // Occasional roar
      if (Math.random() < 0.003) this.float(this.yetiC.x, this.yetiC.y - 90, 'ROOAAARRR! 🦣', '#fff');
    }

    // Fog
    if (this.alive > 18) {
      this.fogAlpha = Math.min(0.28, (this.alive - 18) / 110);
      this.fog.setAlpha(this.fogAlpha);
    }

    this.sTxt.setText('SCORE: ' + Math.floor(this.score));
  }

  float(x, y, msg, col) {
    const t = this.add.text(x, y, msg, { fontSize: '17px', fill: col, fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(25);
    this.tweens.add({ targets: t, y: y - 48, alpha: 0, duration: 1000, onComplete: () => t.destroy() });
  }

  showBanner(title, sub) {
    const bg = this.add.rectangle(W/2, H/2, W, 86, 0x000000, 0.82).setDepth(30);
    const t1 = this.add.text(W/2, H/2 - 14, title, { fontSize: '26px', fontFamily: 'Arial Black', fill: '#00d4ff' }).setOrigin(0.5).setDepth(31);
    const t2 = this.add.text(W/2, H/2 + 18, sub,   { fontSize: '15px', fontFamily: 'Arial', fill: '#fff' }).setOrigin(0.5).setDepth(31);
    this.time.delayedCall(2600, () => { bg.destroy(); t1.destroy(); t2.destroy(); });
  }

  yetiCatch() {
    if (this.done) return; this.done = true;
    this.spawnEv.destroy(); this.mainEv.destroy();

    // Yeti lunges
    this.tweens.add({
      targets: this.yetiC, y: this.sled.y, x: this.sled.x, duration: 700,
      onComplete: () => {
        this.sled.setVisible(false);
        this.cameras.main.shake(500, 0.05);
        this.cameras.main.flash(200, 255, 0, 0);

        // Eating text
        const eat = this.add.text(W/2, H/2, '🦣 OMNOMNOM 🦣', {
          fontSize: '44px', fontFamily: 'Arial Black', fill: '#fff', stroke: '#000', strokeThickness: 6
        }).setOrigin(0.5).setDepth(40);
        this.tweens.add({ targets: eat, angle: [-8,8,-8,8,0], scaleX: [1,1.15,1], scaleY: [1,1.15,1], duration: 300, repeat: 3 });

        this.time.delayedCall(2000, () => this.showFinalScreen());
      }
    });
  }

  showFinalScreen() {
    this.children.removeAll(true);
    this.add.rectangle(W/2, H/2, W, H, 0x000011);

    // Thanks
    this.add.text(W/2, 52, 'Thanks For Choosing', {
      fontSize: '22px', fontFamily: 'Arial', fill: '#8888aa', fontStyle: 'italic'
    }).setOrigin(0.5);
    this.add.text(W/2, 96, 'CONNEXT', {
      fontSize: '66px', fontFamily: 'Arial Black', fill: '#00d4ff', stroke: '#003388', strokeThickness: 10
    }).setOrigin(0.5);
    this.add.text(W/2, 154, '⚡  Broadband That Keeps You Connected  ⚡', {
      fontSize: '14px', fontFamily: 'Arial', fill: '#ff6600'
    }).setOrigin(0.5);

    // Score breakdown
    const sc4 = Math.floor(this.score);
    this.registry.set('l4', sc4);
    this.registry.set('totalScore', (this.registry.get('totalScore') || 0) + sc4);

    const l1 = this.registry.get('l1') || 0;
    const l2 = this.registry.get('l2') || 0;
    const l3 = this.registry.get('l3') || 0;
    const l4 = this.registry.get('l4') || 0;
    const total = l1 + l2 + l3 + l4;

    this.add.rectangle(W/2, 348, 520, 240, 0x001133, 0.92).setStrokeStyle(1, 0x003366);
    this.add.text(W/2, 246, '📊  FINAL SCORE REPORT', {
      fontSize: '22px', fontFamily: 'Arial Black', fill: '#ffd700'
    }).setOrigin(0.5);

    const rows = [
      ['🚚  Fiber Frenzy', l1],
      ['🔌  Line Runner',  l2],
      ['📦  Installer Rush', l3],
      ['🦣  Yeti Run',     l4],
    ];
    rows.forEach(([label, val], i) => {
      this.add.text(W/2 - 200, 278 + i * 36, label, { fontSize: '16px', fontFamily: 'Courier New', fill: '#ccd8ee' });
      this.add.text(W/2 + 200, 278 + i * 36, val.toLocaleString() + ' pts', { fontSize: '16px', fontFamily: 'Courier New', fill: '#ffd700' }).setOrigin(1, 0);
    });
    this.add.rectangle(W/2, 436, 480, 2, 0x00d4ff);
    this.add.text(W/2, 454, 'TOTAL:  ' + total.toLocaleString() + ' pts', {
      fontSize: '26px', fontFamily: 'Arial Black', fill: '#ffd700'
    }).setOrigin(0.5);

    let rating = '⭐ Novice Installer';
    if (total > 5000)  rating = '⭐⭐ Field Tech';
    if (total > 15000) rating = '⭐⭐⭐ Senior Installer';
    if (total > 30000) rating = '⭐⭐⭐⭐ Lead Technician';
    if (total > 55000) rating = '⭐⭐⭐⭐⭐ MASTER CONNECTOR';

    this.add.text(W/2, 497, rating, {
      fontSize: '20px', fontFamily: 'Arial Black', fill: '#ff8800'
    }).setOrigin(0.5);

    // Survived time
    this.add.text(W/2, 526, 'Survived: ' + Math.floor(this.alive) + 's on the mountain', {
      fontSize: '14px', fontFamily: 'Arial', fill: '#6688aa'
    }).setOrigin(0.5);

    const pb = this.add.rectangle(W/2, 572, 300, 50, 0xdd5500).setInteractive({ useHandCursor: true });
    this.add.text(W/2, 572, '▶  PLAY AGAIN', { fontSize: '22px', fontFamily: 'Arial Black', fill: '#fff' }).setOrigin(0.5);
    pb.on('pointerover', () => pb.setFillStyle(0xff7700));
    pb.on('pointerout',  () => pb.setFillStyle(0xdd5500));
    pb.on('pointerdown', () => {
      ['totalScore','l1','l2','l3','l4'].forEach(k => this.registry.set(k, 0));
      this.scene.start('MainMenu');
    });
  }
}

// ─────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────
new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  backgroundColor: '#0a0a1a',
  parent: 'game',
  scene: [MainMenu, Level1, Level2, Level3, Level4],
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.NO_CENTER
  }
});
</script>
</body>
</html>
